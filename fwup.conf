# Firmware update configuration for STM32MP157F-DK2
#
# Modeled after nerves_system_osd32mp1/fwup.conf.
# Defines file resources, partition tables, and tasks for:
#   - complete: Factory flash (blank microSD)
#   - upgrade.a/b: OTA A/B slot updates
#   - provision: Set device-specific variables

require-fwup-version="1.14.0"

include("${NERVES_SDK_IMAGES:-.}/fwup_include/fwup-common.conf")

# ==========================================================================
# File resources
# ==========================================================================

file-resource tf-a-1.stm32 {
    host-path = "${NERVES_SYSTEM}/images/tf-a-stm32mp157c-dk2.stm32"
    assert-size-lte = ${FSBL1_PART_COUNT}
}
file-resource tf-a-2.stm32 {
    host-path = "${NERVES_SYSTEM}/images/tf-a-stm32mp157c-dk2.stm32"
    assert-size-lte = ${FSBL2_PART_COUNT}
}
file-resource fip.bin {
    host-path = "${NERVES_SYSTEM}/images/fip.bin"
    assert-size-lte = ${FIP_PART_COUNT}
}
file-resource rootfs.img {
    host-path = ${ROOTFS}
    assert-size-lte = ${ROOTFS_A_PART_COUNT}
}

# ==========================================================================
# GPT partition table
# ==========================================================================
# Unlike osd32mp1, we don't need separate gpt-a/gpt-b because our boot chain
# loads the kernel directly from the SquashFS rootfs (no FAT boot partition).
# The GPT is the same regardless of which slot is active — U-Boot selects
# the rootfs partition at boot time via the nerves_fw_active variable.

gpt gpt-a {
    guid = ${NERVES_SYSTEM_DISK_UUID}

    partition 0 {
        block-offset = ${FSBL1_PART_OFFSET}
        block-count = ${FSBL1_PART_COUNT}
        type = ${LINUX_FILESYSTEM_DATA_TYPE}
        guid = ${NERVES_SYSTEM_FSBL1_PART_UUID}
        name = "fsbl1"
    }
    partition 1 {
        block-offset = ${FSBL2_PART_OFFSET}
        block-count = ${FSBL2_PART_COUNT}
        type = ${LINUX_FILESYSTEM_DATA_TYPE}
        guid = ${NERVES_SYSTEM_FSBL2_PART_UUID}
        name = "fsbl2"
    }
    partition 2 {
        block-offset = ${FIP_PART_OFFSET}
        block-count = ${FIP_PART_COUNT}
        type = ${LINUX_FILESYSTEM_DATA_TYPE}
        guid = ${NERVES_SYSTEM_FIP_PART_UUID}
        name = "fip"
    }
    partition 3 {
        block-offset = ${ROOTFS_A_PART_OFFSET}
        block-count = ${ROOTFS_A_PART_COUNT}
        type = ${LINUX_FILESYSTEM_DATA_TYPE}
        guid = ${NERVES_SYSTEM_ROOTFS_A_PART_UUID}
        name = "rootfs-a"
    }
    partition 4 {
        block-offset = ${ROOTFS_B_PART_OFFSET}
        block-count = ${ROOTFS_B_PART_COUNT}
        type = ${LINUX_FILESYSTEM_DATA_TYPE}
        guid = ${NERVES_SYSTEM_ROOTFS_B_PART_UUID}
        name = "rootfs-b"
    }
    partition 5 {
        block-offset = ${APP_PART_OFFSET}
        block-count = ${APP_PART_COUNT}
        type = ${LINUX_FILESYSTEM_DATA_TYPE}
        guid = ${NERVES_SYSTEM_APP_PART_UUID}
        name = "app"
        expand = true
    }
}

# ==========================================================================
# U-Boot environment block
# ==========================================================================
# Stored in the unused tail of the FIP partition space.
# Must match uboot.fragment CONFIG_ENV_OFFSET and fw_env.config.
uboot-environment uboot-env {
    block-offset = ${UBOOT_ENV_OFFSET}
    block-count = ${UBOOT_ENV_COUNT}
}

# ==========================================================================
# Task: complete — Factory flash (blank microSD)
# ==========================================================================
# Writes everything: GPT, bootloaders, rootfs, environment.
# ONLY use for first flash or when you want a completely clean start.
# WARNING: Wipes the app partition (SSH keys, WiFi credentials, app data).

task complete {
    require-unmounted-destination = true

    on-init {
        gpt_write(gpt-a)

        uboot_clearenv(uboot-env)

        include("${NERVES_PROVISIONING}")

        uboot_setenv(uboot-env, "nerves_fw_active", "a")
        uboot_setenv(uboot-env, "nerves_fw_autovalidate", "0")
        uboot_setenv(uboot-env, "nerves_fw_validated", "1")
        uboot_setenv(uboot-env, "nerves_fw_booted", "0")
        uboot_setenv(uboot-env, "nerves_fw_devpath", ${NERVES_FW_DEVPATH})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_devpath", ${NERVES_FW_APPLICATION_PART0_DEVPATH})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_fstype", ${NERVES_FW_APPLICATION_PART0_FSTYPE})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_target", ${NERVES_FW_APPLICATION_PART0_TARGET})
        uboot_setenv(uboot-env, "a.nerves_fw_product", ${NERVES_FW_PRODUCT})
        uboot_setenv(uboot-env, "a.nerves_fw_description", ${NERVES_FW_DESCRIPTION})
        uboot_setenv(uboot-env, "a.nerves_fw_version", ${NERVES_FW_VERSION})
        uboot_setenv(uboot-env, "a.nerves_fw_platform", ${NERVES_FW_PLATFORM})
        uboot_setenv(uboot-env, "a.nerves_fw_architecture", ${NERVES_FW_ARCHITECTURE})
        uboot_setenv(uboot-env, "a.nerves_fw_author", ${NERVES_FW_AUTHOR})
        uboot_setenv(uboot-env, "a.nerves_fw_vcs_identifier", ${NERVES_FW_VCS_IDENTIFIER})
        uboot_setenv(uboot-env, "a.nerves_fw_misc", ${NERVES_FW_MISC})
        uboot_setenv(uboot-env, "a.nerves_fw_uuid", "\${FWUP_META_UUID}")

        # Smart bootcmd — handles A/B slot switching and boot-counting auto-revert.
        # Uses \${} to escape U-Boot variable references so fwup writes them literally.
        # Logic:
        #   1. Check for failed boot (booted=1 + validated!=1) → revert to other slot
        #   2. Mark boot attempt (set booted=1)
        #   3. Select rootfs partition based on nerves_fw_active (a→4, b→5)
        #   4. Load kernel + DTB from SquashFS, set bootargs, boot
        uboot_setenv(uboot-env, "bootcmd", "if test x\${nerves_fw_booted} = x1; then if test x\${nerves_fw_validated} != x1; then echo Reverting firmware...; if test x\${nerves_fw_active} = xb; then setenv nerves_fw_active a; else setenv nerves_fw_active b; fi; setenv nerves_fw_validated 1; setenv nerves_fw_booted 1; saveenv; fi; fi; if test x\${nerves_fw_booted} != x1; then setenv nerves_fw_booted 1; saveenv; fi; if test x\${nerves_fw_active} = xb; then setenv rootpart 5; else setenv rootpart 4; fi; sqfsload mmc 0:\${rootpart} 0xc2000000 boot/zImage; sqfsload mmc 0:\${rootpart} 0xc4000000 boot/stm32mp157c-dk2.dtb; setenv bootargs console=ttySTM0,115200 root=/dev/mmcblk0p\${rootpart} rootfstype=squashfs rootwait loglevel=4; bootz 0xc2000000 - 0xc4000000")
    }

    on-resource tf-a-1.stm32 { raw_write(${FSBL1_PART_OFFSET}) }
    on-resource tf-a-2.stm32 { raw_write(${FSBL2_PART_OFFSET}) }
    on-resource fip.bin { raw_write(${FIP_PART_OFFSET}) }
    on-resource rootfs.img { raw_write(${ROOTFS_A_PART_OFFSET}) }

    on-finish {
        # Clear out any old data in slot B that might confuse things
        raw_memset(${ROOTFS_B_PART_OFFSET}, 256, 0xff)

        # Invalidate the application data partition so nerves_runtime
        # triggers the auto-format code on first boot
        raw_memset(${APP_PART_OFFSET}, 256, 0xff)
    }
}

# ==========================================================================
# Task: upgrade.a — Write to slot A (when running from slot B)
# ==========================================================================

task upgrade.a {
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")
    require-uboot-variable(uboot-env, "nerves_fw_validated", "1")
    require-uboot-variable(uboot-env, "b.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "b.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")

    on-init {
        info("Upgrading partition A")

        # Clear firmware info in case update is interrupted
        uboot_unsetenv(uboot-env, "a.nerves_fw_version")
        uboot_unsetenv(uboot-env, "a.nerves_fw_platform")
        uboot_unsetenv(uboot-env, "a.nerves_fw_architecture")
        uboot_unsetenv(uboot-env, "a.nerves_fw_uuid")
    }

    on-resource rootfs.img {
        delta-source-raw-offset=${ROOTFS_B_PART_OFFSET}
        delta-source-raw-count=${ROOTFS_B_PART_COUNT}
        raw_write(${ROOTFS_A_PART_OFFSET})
    }

    on-finish {
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_devpath", ${NERVES_FW_APPLICATION_PART0_DEVPATH})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_fstype", ${NERVES_FW_APPLICATION_PART0_FSTYPE})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_target", ${NERVES_FW_APPLICATION_PART0_TARGET})
        uboot_setenv(uboot-env, "a.nerves_fw_product", ${NERVES_FW_PRODUCT})
        uboot_setenv(uboot-env, "a.nerves_fw_description", ${NERVES_FW_DESCRIPTION})
        uboot_setenv(uboot-env, "a.nerves_fw_version", ${NERVES_FW_VERSION})
        uboot_setenv(uboot-env, "a.nerves_fw_platform", ${NERVES_FW_PLATFORM})
        uboot_setenv(uboot-env, "a.nerves_fw_architecture", ${NERVES_FW_ARCHITECTURE})
        uboot_setenv(uboot-env, "a.nerves_fw_author", ${NERVES_FW_AUTHOR})
        uboot_setenv(uboot-env, "a.nerves_fw_vcs_identifier", ${NERVES_FW_VCS_IDENTIFIER})
        uboot_setenv(uboot-env, "a.nerves_fw_misc", ${NERVES_FW_MISC})
        uboot_setenv(uboot-env, "a.nerves_fw_uuid", "\${FWUP_META_UUID}")

        # Switch to slot A, reset validation for boot-counting
        uboot_setenv(uboot-env, "nerves_fw_active", "a")
        uboot_setenv(uboot-env, "nerves_fw_validated", "0")
        uboot_setenv(uboot-env, "nerves_fw_booted", "0")

        # NOTE: Do NOT touch bootcmd here. The firmware app's BootcmdMigration
        # module installs a smart bootcmd on first boot. We must preserve it
        # across OTA upgrades. Unsetting it would cause U-Boot to fall back to
        # CONFIG_BOOTCOMMAND (which on old U-Boot hardcodes partition 4).
    }
}

# ==========================================================================
# Task: upgrade.b — Write to slot B (when running from slot A)
# ==========================================================================

task upgrade.b {
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")
    require-uboot-variable(uboot-env, "nerves_fw_validated", "1")
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")

    on-init {
        info("Upgrading partition B")

        uboot_unsetenv(uboot-env, "b.nerves_fw_version")
        uboot_unsetenv(uboot-env, "b.nerves_fw_platform")
        uboot_unsetenv(uboot-env, "b.nerves_fw_architecture")
        uboot_unsetenv(uboot-env, "b.nerves_fw_uuid")
    }

    on-resource rootfs.img {
        delta-source-raw-offset=${ROOTFS_A_PART_OFFSET}
        delta-source-raw-count=${ROOTFS_A_PART_COUNT}
        raw_write(${ROOTFS_B_PART_OFFSET})
    }

    on-finish {
        uboot_setenv(uboot-env, "b.nerves_fw_application_part0_devpath", ${NERVES_FW_APPLICATION_PART0_DEVPATH})
        uboot_setenv(uboot-env, "b.nerves_fw_application_part0_fstype", ${NERVES_FW_APPLICATION_PART0_FSTYPE})
        uboot_setenv(uboot-env, "b.nerves_fw_application_part0_target", ${NERVES_FW_APPLICATION_PART0_TARGET})
        uboot_setenv(uboot-env, "b.nerves_fw_product", ${NERVES_FW_PRODUCT})
        uboot_setenv(uboot-env, "b.nerves_fw_description", ${NERVES_FW_DESCRIPTION})
        uboot_setenv(uboot-env, "b.nerves_fw_version", ${NERVES_FW_VERSION})
        uboot_setenv(uboot-env, "b.nerves_fw_platform", ${NERVES_FW_PLATFORM})
        uboot_setenv(uboot-env, "b.nerves_fw_architecture", ${NERVES_FW_ARCHITECTURE})
        uboot_setenv(uboot-env, "b.nerves_fw_author", ${NERVES_FW_AUTHOR})
        uboot_setenv(uboot-env, "b.nerves_fw_vcs_identifier", ${NERVES_FW_VCS_IDENTIFIER})
        uboot_setenv(uboot-env, "b.nerves_fw_misc", ${NERVES_FW_MISC})
        uboot_setenv(uboot-env, "b.nerves_fw_uuid", "\${FWUP_META_UUID}")

        # Switch to slot B, reset validation for boot-counting
        uboot_setenv(uboot-env, "nerves_fw_active", "b")
        uboot_setenv(uboot-env, "nerves_fw_validated", "0")
        uboot_setenv(uboot-env, "nerves_fw_booted", "0")

        # NOTE: Do NOT touch bootcmd here. The firmware app's BootcmdMigration
        # module installs a smart bootcmd on first boot. We must preserve it
        # across OTA upgrades. Unsetting it would cause U-Boot to fall back to
        # CONFIG_BOOTCOMMAND (which on old U-Boot hardcodes partition 4).
    }
}

# ==========================================================================
# Safety tasks — prevent common mistakes
# ==========================================================================

task upgrade.unvalidated {
    require-uboot-variable(uboot-env, "nerves_fw_validated", "0")

    on-init {
        error("Please validate the running firmware before upgrading it again.")
    }
}

task upgrade.wrong {
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")
    on-init {
        error("Please check the media being upgraded. It doesn't look like either the A or B partitions are active.")
    }
}

task upgrade.wrongplatform {
    on-init {
        error("Expecting platform=${NERVES_FW_PLATFORM} and architecture=${NERVES_FW_ARCHITECTURE}")
    }
}

# ==========================================================================
# Task: provision — Set device-specific variables
# ==========================================================================

task provision {
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")
    on-init {
        include("${NERVES_PROVISIONING}")
    }
}
task provision.wrongplatform {
    on-init {
        error("Expecting platform=${NERVES_FW_PLATFORM} and architecture=${NERVES_FW_ARCHITECTURE}")
    }
}
