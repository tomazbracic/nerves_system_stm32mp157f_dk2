# Default provisioning configuration
#
# This file is included during the "complete" task to set provisioning-specific
# environment variables. Override by setting NERVES_PROVISIONING at firmware
# build time to point to a custom provisioning.conf.
#
# Provisioning is where you'd set device-specific values like serial numbers,
# factory WiFi credentials, or hardware revision identifiers.
#
# Example:
#   uboot_setenv(uboot-env, "nerves_serial_number", "DK2-001")
#   uboot_setenv(uboot-env, "nerves_hw_revision", "v1.0")
