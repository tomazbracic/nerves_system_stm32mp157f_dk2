# Common fwup configuration for STM32MP157F-DK2
#
# Shared between fwup.conf and fwup-revert.conf via include().
# Modeled after nerves_system_osd32mp1/fwup_include/fwup-common.conf.

# ==========================================================================
# Firmware metadata defaults
# ==========================================================================
define(NERVES_FW_PRODUCT, "Nerves Firmware")
define(NERVES_FW_DESCRIPTION, "")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
define(NERVES_FW_PLATFORM, "stm32mp157f_dk2")
define(NERVES_FW_ARCHITECTURE, "arm")
define(NERVES_FW_AUTHOR, "The Nerves Team")

# ==========================================================================
# Partition type GUIDs
# ==========================================================================
# The STM32MP1 ROM code searches for GPT partitions named "fsbl*"
# (matches by name, not by type GUID). We use "Linux filesystem" for
# all partitions — matches upstream Buildroot's genimage for this board.
define(LINUX_FILESYSTEM_DATA_TYPE, "0fc63daf-8483-4772-8e79-3d69d8477de4")

# ==========================================================================
# Partition UUIDs (unique per partition, stable across builds)
# ==========================================================================
define(NERVES_SYSTEM_DISK_UUID, "a1b2c3d4-e5f6-7890-abcd-ef1234567890")
define(NERVES_SYSTEM_FSBL1_PART_UUID, "b1a1e1f1-0001-4000-8000-000000000001")
define(NERVES_SYSTEM_FSBL2_PART_UUID, "b1a1e1f1-0002-4000-8000-000000000002")
define(NERVES_SYSTEM_FIP_PART_UUID, "b1a1e1f1-0003-4000-8000-000000000003")
define(NERVES_SYSTEM_ROOTFS_A_PART_UUID, "b1a1e1f1-0004-4000-8000-000000000004")
define(NERVES_SYSTEM_ROOTFS_B_PART_UUID, "b1a1e1f1-0005-4000-8000-000000000005")
define(NERVES_SYSTEM_APP_PART_UUID, "b1a1e1f1-0006-4000-8000-000000000006")

# ==========================================================================
# Device paths
# ==========================================================================
define(NERVES_FW_DEVPATH, "/dev/mmcblk0")
define(NERVES_FW_APPLICATION_PART0_DEVPATH, "/dev/mmcblk0p6")
define(NERVES_FW_APPLICATION_PART0_FSTYPE, "f2fs")
define(NERVES_FW_APPLICATION_PART0_TARGET, "/root")
define(NERVES_PROVISIONING, "${NERVES_SYSTEM}/images/fwup_include/provisioning.conf")

# Default rootfs path
define(ROOTFS, "${NERVES_SYSTEM}/images/rootfs.squashfs")

# ==========================================================================
# Partition layout (512-byte blocks)
# ==========================================================================
#
# +----------------------------+
# | GPT header (sectors 0-33)  |
# +----------------------------+
# | p0: fsbl1 (256 KiB)       |  TF-A BL2
# +----------------------------+
# | p1: fsbl2 (256 KiB)       |  TF-A BL2 copy (redundancy)
# +----------------------------+
# | p2: fip   (4 MiB)         |  FIP: sp_min + U-Boot + DTB
# |   [U-Boot env at 0x480000]|  (in unused tail of FIP space)
# +----------------------------+
# | p3: rootfs-a (256 MiB)    |  SquashFS root filesystem (slot A)
# +----------------------------+
# | p4: rootfs-b (256 MiB)    |  SquashFS root filesystem (slot B)
# +----------------------------+
# | p5: app (512+ MiB)        |  Persistent app data (f2fs)
# +----------------------------+

# fsbl1: TF-A first-stage bootloader
define(FSBL1_PART_OFFSET, 34)
define(FSBL1_PART_COUNT, 512)

# fsbl2: TF-A copy (STM32MP1 ROM tries fsbl2 if fsbl1 fails)
define-eval(FSBL2_PART_OFFSET, "${FSBL1_PART_OFFSET} + ${FSBL1_PART_COUNT}")
define(FSBL2_PART_COUNT, 512)

# fip: Firmware Image Package (sp_min + U-Boot + DTB)
define-eval(FIP_PART_OFFSET, "${FSBL2_PART_OFFSET} + ${FSBL2_PART_COUNT}")
define(FIP_PART_COUNT, 8192)

# U-Boot environment stored in unused tail of FIP partition space
# Offset 0x480000 = 4,718,592 bytes / 512 = sector 9216
# Size 0x2000 = 8,192 bytes = 16 sectors
# Must match uboot.fragment CONFIG_ENV_OFFSET and fw_env.config
define(UBOOT_ENV_OFFSET, 9216)
define(UBOOT_ENV_COUNT, 16)

# rootfs-a: Slot A root filesystem (SquashFS)
define-eval(ROOTFS_A_PART_OFFSET, "${FIP_PART_OFFSET} + ${FIP_PART_COUNT}")
define(ROOTFS_A_PART_COUNT, 524288)

# rootfs-b: Slot B root filesystem (SquashFS)
define-eval(ROOTFS_B_PART_OFFSET, "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT}")
define(ROOTFS_B_PART_COUNT, ${ROOTFS_A_PART_COUNT})

# app: Persistent application data (f2fs), mounted at /root
define-eval(APP_PART_OFFSET, "${ROOTFS_B_PART_OFFSET} + ${ROOTFS_B_PART_COUNT}")
define(APP_PART_COUNT, 1048576)

# ==========================================================================
# Firmware archive metadata
# ==========================================================================
meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}
meta-vcs-identifier = ${NERVES_FW_VCS_IDENTIFIER}
meta-misc = ${NERVES_FW_MISC}
